name: Build and verify Track 1 agent
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unpack reviewed source
        run: unzip -q agenthon-track1-source.zip -d source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run synthetic harness tests
        run: |
          python -m pip install pytest==8.3.5 pytest-json-report==1.5.0 pytest-timeout==2.3.1
          python source/tests/test_agent.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: source
          platforms: linux/amd64
          load: true
          tags: deltanlp-track1:verify
      - name: Verify image and constrained Python execution
        run: |
          test "$(docker inspect -f '{{.Architecture}}' deltanlp-track1:verify)" = amd64
          test "$(docker inspect -f '{{ index .Config.Labels "qfbench2.interface_version" }}' deltanlp-track1:verify)" = 2.0
          test "$(docker inspect -f '{{json .Config.Volumes}}' deltanlp-track1:verify)" = null
          docker run --rm --network=none --user 65534:65534 --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m --entrypoint python \
            deltanlp-track1:verify -c 'import numpy,pandas,scipy,pyarrow,sklearn,statsmodels.api,openpyxl,polars,numba,arch,lxml,bs4; import numpy as np; from scipy.optimize import brentq; assert abs(brentq(lambda x:x*x-2,0,2)-np.sqrt(2))<1e-10; print("Scientific dependencies imported and root finding passed")'
          docker run --rm --network=none --user 65534:65534 --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m --pids-limit 256 \
            --ulimit nofile=1024:1024 --ulimit nproc=256:256 \
            -e DELTANLP_TEST_ROOT=/tmp -v "$PWD/source/tests:/agent/tests:ro" --entrypoint python \
            deltanlp-track1:verify /agent/tests/test_agent.py
      - name: Push immutable candidate
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: source
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mehedi-bepary/deltanlp-agenthon-track1:${{ github.sha }}
      - name: Record digest
        run: echo 'Image digest ${{ steps.publish.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
